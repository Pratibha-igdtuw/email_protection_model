name: Refresh PhishTank snapshot

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh snapshot
        env:
          PHISHTANK_API_KEY: ${{ secrets.PHISHTANK_API_KEY }}
        run: python ml_model/refresh_phishtank.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml_model/phishtank_domains.csv ml_model/phishtank_metadata.json
          git diff --cached --quiet || git commit -m "chore: refresh PhishTank snapshot"
          git push
