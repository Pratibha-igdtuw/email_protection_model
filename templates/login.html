{% extends 'base.html' %}
{% block title %}Analyst Login — ThreatForensicAI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="fa-solid fa-shield-halved fa-2x text-accent mb-2"></i>
          <h4 class="fw-bold mb-0">Analyst Login</h4>
          <p class="text-muted small">This platform handles forensic case evidence — sign in to continue.</p>
        </div>
        <form method="post" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-right-to-bracket me-2"></i>Log In
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
